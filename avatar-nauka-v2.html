<style>

<div id="app"></div>
<script>
const VOCAB=[

["meistern","opanować, pokonać"],["das Element, -e","żywioł, element"],["gnadenlos","bezlitosny"],

["die Schuld","wina"],["schief laufen","pójść nie tak"],["unreif","niedojrzały"],

["dreckig","brudny"],["die Socke, -n","skarpeta"],["angenehm","przyjemny"],
["sich beruhigen","uspokoić się"],["der Kram","rzeczy, graty"],["allein","sam, samodzielnie"],
["helfen","pomagać"],["kennen","znać"],["die Suche","poszukiwanie"],
["sich dem Ende neigen","zbliżać się ku końcowi"],["die Quelle, -n","źródło"],
["mächtig","potężny, silny"],["der Prinz","książę"],["sich aufregen","denerwować się"],
["sich setzen","usiąść"],["der Jasmintee","herbata jaśminowa"],["der Steuermann","sternik"],
["der Pinguin, -e","pingwin"],["der Schlitten, -","sanki, sanie"],["festsitzen","utknąć"],
["erfrieren","zamarznąć (na śmierć)"],["sich festhalten","trzymać się (mocno)"],
["begeisternd","fascynujący"],["schweben","unosić się, lewitować"],["der Himmel","niebo"],
["lächeln","uśmiechać się"],["sich ausruhen","odpoczywać"],["der Schlaf","sen"],
["scheitern","ponieść porażkę"],["die Ehre","honor, cześć"],["abhängen von (+Dat)","zależeć od"],
["das Versteck","kryjówka"],["das Dorf, die Dörfer","wioska"],["kennenlernen","poznać (kogoś)"],
["ausgestorben","wymarły, wyginięty"],["die Enkel (Pl.)","wnuki"],["die Großmutter","babcia"],
["die Waffe, -n","broń"],["aufspießen","nabić na ostrze"],["der Luftstrom","prąd powietrza"],
["kontrollieren","kontrolować"],["fliegen","latać"],["der Blödsinn","bzdury, głupoty"],
["der Wachturm","wieża strażnicza"],["ausbilden","szkolić, kształcić"],["die Weisheit","mądrość"],
["die Zunge, -n","język (narząd)"],["feststecken","utknąć, tkwić"],["der Atem","oddech"],
["die Energie","energia"],["die Gliedmaßen (Pl.)","kończyny"],["üben","ćwiczyć"],
["ungeduldig","niecierpliwy"],["die Grundlagen (Pl.)","podstawy"],["beherrschen","opanować, władać"],
["fortgeschritten","zaawansowany"],["die Furcht","strach, obawa"],["begegnen (+Dat)","spotkać, napotkać"],
["der Mut","odwaga"],["der Krieger, -","wojownik"],["dringend","pilnie, nagląco"],
["der Eisberg, -e","góra lodowa"],["unmöglich","niemożliwy"],["die Erklärung, -en","wyjaśnienie"],
["unfassbar","niepojęty, niewiarygodny"],["unheimlich","niesamowity, przerażający"],
["die Falle, -n","pułapka"],["verfolgen","ścigać, prześladować"],["verlieren","stracić, zgubić"],
["der Meister, -","mistrz"],["agil","zwinny, gibki"],["wecken","budzić (kogoś)"],
];

const MASTERY=3, REVIEW_AFTER=8, INIT_POOL=5, ADD_BATCH=2;
const T={bg:"#06080B",card:"#0F1318",cardUp:"#161C24",green:"#00E676",greenDim:"#00C764",greenBg:"rgba(0,230,118,0.07)",red:"#FF5252",redBg:"rgba(255,82,82,0.07)",orange:"#FFB74D",orangeBg:"rgba(255,183,77,0.08)",blue:"#42A5F5",blueBg:"rgba(66,165,245,0.08)",gold:"#FFD740",goldBg:"rgba(255,215,64,0.08)",text:"#E8ECF1",dim:"#5A6978",border:"#1A2130",surface:"#0B0F14"};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function normalize(s){return s.toLowerCase().replace(/[,.\(\)\-\+]/g,"").replace(/\s+/g," ").trim();}
function el(tag,attrs,...ch){const e=document.createElement(tag);if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="class")e.className=v;else if(k==="disabled"){e.disabled=v;}else e.setAttribute(k,v);});ch.flat(9).forEach(c=>{if(c==null||c===false)return;if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));else e.appendChild(c);});return e;}

/*
  wordState[i] = {
    streak: 0..MASTERY,    // correct answers in row
    seen: number,          // total times seen
    lastWrong: bool,       // got it wrong last time
    cooldown: number,      // turns to wait before showing again (for wrong answers)
    mastered: bool,        // reached MASTERY
    masteredAt: number,    // global turn when mastered
    reviewing: bool,       // in review mode (was mastered, checking again)
  }
*/

let S = {
  phase:"intro", // intro | settings | learn | done
  modes:{flash:true,quiz4:true,write:true,match:true},
  wordState:{},
  pool:[],
  nextUnlocked:INIT_POOL,
  activity:null,
  flipped:false,
  quizAnswer:null,
  writeInput:"",
  writeResult:null,
  matchSelected:null,
  matchMatched:new Set(),
  matchWrong:null,
  combo:0,
  totalAnswered:0,
  totalCorrect:0,
  globalTurn:0,
  justMastered:null,
  justAdded:null,
  justReview:false,
};

function getMastered(){return Object.values(S.wordState).filter(s=>s.mastered&&!s.reviewing).length;}
function getReviewing(){return Object.values(S.wordState).filter(s=>s.reviewing).length;}

function enabledModes(){
  const m=[];
  if(S.modes.flash)m.push("flash");
  if(S.modes.quiz4)m.push("quiz4");
  if(S.modes.write)m.push("write");
  if(S.modes.match)m.push("match");
  return m.length?m:["flash"];
}

function pickActivity(streak){
  const avail=enabledModes();
  if(avail.length===1)return avail[0];
  // progression: flash first, then harder
  let candidates;
  if(streak===0){
    candidates=avail.filter(m=>m==="flash"||m==="quiz4");
    if(!candidates.length)candidates=avail;
  } else if(streak===1){
    candidates=avail.filter(m=>m==="quiz4"||m==="flash");
    if(!candidates.length)candidates=avail;
  } else if(streak===2){
    candidates=avail.filter(m=>m==="write"||m==="quiz4");
    if(!candidates.length)candidates=avail;
  } else {
    candidates=avail.filter(m=>m!=="flash");
    if(!candidates.length)candidates=avail;
  }
  return shuffle(candidates)[0];
}

function pickNext(){
  S.flipped=false;S.quizAnswer=null;S.writeInput="";S.writeResult=null;
  S.matchSelected=null;S.matchMatched=new Set();S.matchWrong=null;
  S.justMastered=null;S.justAdded=null;S.justReview=false;
  S.globalTurn++;

  // decrease cooldowns
  S.pool.forEach(i=>{
    if(S.wordState[i]&&S.wordState[i].cooldown>0) S.wordState[i].cooldown--;
  });

  // check if any mastered words need review
  let reviewCandidate=null;
  S.pool.forEach(i=>{
    const ws=S.wordState[i];
    if(ws&&ws.mastered&&!ws.reviewing&&ws.masteredAt&&(S.globalTurn-ws.masteredAt)>=REVIEW_AFTER){
      if(!reviewCandidate||(S.globalTurn-ws.masteredAt)>(S.globalTurn-(S.wordState[reviewCandidate]?.masteredAt||0))){
        reviewCandidate=i;
      }
    }
  });

  // 20% chance to trigger review if available, or if no other candidates
  const activeCards=S.pool.filter(i=>{
    const ws=S.wordState[i];
    if(!ws)return false;
    if(ws.mastered&&!ws.reviewing)return false;
    if(ws.cooldown>0)return false;
    if(ws.streak>=MASTERY&&!ws.reviewing)return false;
    return true;
  });

  if(reviewCandidate!==null&&(Math.random()<0.2||activeCards.length===0)){
    // Start review
    S.wordState[reviewCandidate].reviewing=true;
    S.wordState[reviewCandidate].streak=MASTERY-1; // needs 1 correct to re-master
    S.wordState[reviewCandidate].mastered=false;
    S.justReview=true;
    setActivity(reviewCandidate);
    render();
    return;
  }

  if(activeCards.length===0){
    // check if truly done
    const allMastered=S.pool.every(i=>S.wordState[i]?.mastered);
    if(allMastered&&S.nextUnlocked>=VOCAB.length){S.phase="done";render();return;}
    // some on cooldown, just wait / pick anyone
    const cooldownCards=S.pool.filter(i=>{const ws=S.wordState[i];return ws&&!ws.mastered&&ws.cooldown>0;});
    if(cooldownCards.length>0){
      // force pick one with lowest cooldown
      cooldownCards.sort((a,b)=>(S.wordState[a].cooldown||0)-(S.wordState[b].cooldown||0));
      S.wordState[cooldownCards[0]].cooldown=0;
      setActivity(cooldownCards[0]);
      render();return;
    }
    S.phase="done";render();return;
  }

  // Weighted pick from active cards
  const weighted=activeCards.map(i=>{
    const s=S.wordState[i]||{streak:0,seen:0,lastWrong:false,cooldown:0};
    let w=10;
    if(s.lastWrong)w+=20;
    if(s.seen===0)w+=15;
    if(s.reviewing)w+=10;
    w+=(MASTERY-s.streak)*5;
    return{idx:i,weight:w};
  });
  const totalW=weighted.reduce((a,b)=>a+b.weight,0);
  let r=Math.random()*totalW,chosen=weighted[0].idx;
  for(const w of weighted){r-=w.weight;if(r<=0){chosen=w.idx;break;}}

  setActivity(chosen);
  render();
}

function setActivity(wordIdx){
  const s=S.wordState[wordIdx]||{streak:0};
  const type=pickActivity(s.streak);

  if(type==="match"){
    const pool=S.pool.filter(i=>i!==wordIdx);
    const others=shuffle(pool).slice(0,3);
    const mw=shuffle([wordIdx,...others]);
    const lefts=shuffle(mw.map((wi,i)=>({id:"l"+i,text:VOCAB[wi][0],pairId:wi,side:"left"})));
    const rights=shuffle(mw.map((wi,i)=>({id:"r"+i,text:VOCAB[wi][1],pairId:wi,side:"right"})));
    S.activity={type:"match",wordIdx,matchPairs:[...lefts,...rights],matchWords:mw};
  } else if(type==="quiz4"){
    const otherIdxs=shuffle([...Array(VOCAB.length).keys()].filter(i=>i!==wordIdx)).slice(0,3);
    S.activity={type:"quiz4",wordIdx,options:shuffle([wordIdx,...otherIdxs])};
  } else {
    S.activity={type,wordIdx};
  }
}

function handleAnswer(wordIdx,correct){
  S.totalAnswered++;
  if(correct)S.totalCorrect++;
  const prev=S.wordState[wordIdx]||{streak:0,seen:0,lastWrong:false,cooldown:0};

  if(correct){
    S.wordState[wordIdx]={...prev,streak:prev.streak+1,seen:prev.seen+1,lastWrong:false,cooldown:0};
    S.combo++;
  } else {
    // Wrong: reset streak, set cooldown (show later, not immediately)
    const cd=3+Math.floor(Math.random()*3); // 3-5 turns cooldown
    S.wordState[wordIdx]={...prev,streak:Math.max(0,prev.streak-1),seen:prev.seen+1,lastWrong:true,cooldown:cd};
    S.combo=0;
  }

  const ws=S.wordState[wordIdx];

  // Check mastery
  if(correct&&ws.streak>=MASTERY&&!ws.mastered){
    ws.mastered=true;
    ws.masteredAt=S.globalTurn;
    ws.reviewing=false;
    S.justMastered=wordIdx;

    // Add new words
    if(S.nextUnlocked<VOCAB.length){
      const toAdd=Math.min(ADD_BATCH,VOCAB.length-S.nextUnlocked);
      for(let i=0;i<toAdd;i++){
        const ni=S.nextUnlocked+i;
        S.pool.push(ni);
        S.wordState[ni]={streak:0,seen:0,lastWrong:false,cooldown:0,mastered:false,masteredAt:null,reviewing:false};
      }
      S.justAdded=toAdd;
      S.nextUnlocked+=toAdd;
    }
    render();
    setTimeout(()=>pickNext(),1800);
  } else if(correct&&ws.reviewing&&ws.streak>=MASTERY){
    // Re-mastered after review
    ws.mastered=true;
    ws.masteredAt=S.globalTurn;
    ws.reviewing=false;
    S.justMastered=wordIdx;
    render();
    setTimeout(()=>pickNext(),1800);
  } else {
    render();
    setTimeout(()=>pickNext(),correct?600:1500);
  }
}

function startLearn(){
  S.wordState={};
  for(let i=0;i<INIT_POOL;i++) S.wordState[i]={streak:0,seen:0,lastWrong:false,cooldown:0,mastered:false,masteredAt:null,reviewing:false};
  S.pool=[...Array(INIT_POOL).keys()];
  S.nextUnlocked=INIT_POOL;
  S.phase="learn";
  S.combo=0;S.totalAnswered=0;S.totalCorrect=0;S.globalTurn=0;
  pickNext();
}

// ==================== RENDER ====================
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  app.style.cssText="width:100%;max-width:500px;margin:0 auto;";
  if(S.phase==="intro")renderIntro(app);
  else if(S.phase==="settings")renderSettings(app);
  else if(S.phase==="done")renderDone(app);
  else renderLearn(app);
}

function renderIntro(app){
  app.appendChild(el("div",{style:{textAlign:"center",marginTop:"60px"}},
    el("div",{style:{width:"80px",height:"80px",borderRadius:"24px",background:`linear-gradient(135deg,${T.green}22,${T.blue}22)`,border:`1px solid ${T.green}33`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",fontSize:"36px"}},"🧠"),
    el("h1",{style:{fontSize:"28px",fontWeight:800,color:"#fff",marginBottom:"8px"}},"Tryb Nauki"),
    el("p",{style:{fontSize:"15px",color:T.dim,marginBottom:"6px"}},`Avatar S01E01 · ${VOCAB.length} słówek`),
    el("p",{style:{fontSize:"14px",color:T.dim,marginBottom:"12px",lineHeight:"1.6",padding:"0 10px"}},
      `Inteligentna nauka: zaczynam od ${INIT_POOL} słówek, mieszam tryby, dodaję nowe jak opanujesz stare. Błędne słówka wracają później — nie od razu. Opanowane słówka wracają po jakimś czasie, żeby sprawdzić czy pamiętasz!`),

    // Feature pills
    el("div",{style:{display:"flex",gap:"6px",justifyContent:"center",flexWrap:"wrap",marginBottom:"28px",padding:"0 10px"}},
      ...[["🔁","Spaced repetition"],["📈","Stopniowa nauka"],["🎯","Mix trybów"],["⏳","Opóźnione powtórki"]].map(([ic,lb])=>
        el("span",{style:{padding:"5px 10px",borderRadius:"8px",background:T.surface,border:`1px solid ${T.border}`,fontSize:"12px",color:T.dim,fontWeight:600}},ic+" "+lb)
      )
    ),

    el("button",{style:{padding:"16px 48px",borderRadius:"16px",border:"none",background:`linear-gradient(135deg,${T.green},${T.greenDim})`,color:"#000",fontWeight:800,fontSize:"17px",cursor:"pointer",boxShadow:`0 4px 24px ${T.green}33`,marginBottom:"16px",display:"block",margin:"0 auto 16px"},onClick:()=>{S.phase="settings";render();}},"Ustawienia i start →"),
  ));
}

function renderSettings(app){
  const modes=[
    {id:"flash",icon:"🔄",label:"Fiszki",desc:"Odkrywasz odpowiedź i oceniasz",color:T.blue},
    {id:"quiz4",icon:"🎯",label:"Quiz",desc:"4 odpowiedzi do wyboru",color:T.green},
    {id:"write",icon:"✍️",label:"Pisanie",desc:"Wpisujesz tłumaczenie sam",color:T.orange},
    {id:"match",icon:"🧩",label:"Dopasuj",desc:"Łączysz słówka w pary",color:T.gold},
  ];

  const wrap=el("div",{style:{marginTop:"40px"}},
    el("button",{style:{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:"14px",fontWeight:600,marginBottom:"20px",padding:"4px 0"},onClick:()=>{S.phase="intro";render();}},"← Wróć"),
    el("h2",{style:{fontSize:"22px",fontWeight:800,color:"#fff",marginBottom:"6px"}},"Wybierz tryby nauki"),
    el("p",{style:{fontSize:"14px",color:T.dim,marginBottom:"20px",lineHeight:"1.5"}},"Apka będzie mieszać wybrane tryby. Musisz mieć min. 1 włączony."),
  );

  const grid=el("div",{style:{display:"flex",flexDirection:"column",gap:"10px",marginBottom:"28px"}});
  modes.forEach(m=>{
    const on=S.modes[m.id];
    const btn=el("button",{class:"toggle-btn"+(on?" on":""),onClick:()=>{
      // Must keep at least 1
      const others=Object.entries(S.modes).filter(([k,v])=>k!==m.id&&v);
      if(on&&others.length===0)return; // can't disable last one
      S.modes[m.id]=!on;
      render();
    }},
      el("span",{class:"icon"},m.icon),
      el("div",{style:{flex:1,textAlign:"left"}},
        el("div",{style:{fontSize:"15px",fontWeight:700}},m.label),
        el("div",{style:{fontSize:"12px",color:on?T.green+"AA":T.dim,fontWeight:400,marginTop:"2px"}},m.desc),
      ),
      el("div",{style:{width:"24px",height:"24px",borderRadius:"6px",border:`2px solid ${on?T.green:T.border}`,background:on?T.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",color:"#000",fontWeight:800,transition:"all .2s"}},on?"✓":""),
    );
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);

  // Info box
  wrap.appendChild(el("div",{style:{padding:"14px 16px",borderRadius:"12px",background:T.surface,border:`1px solid ${T.border}`,marginBottom:"24px"}},
    el("div",{style:{fontSize:"13px",color:T.dim,lineHeight:"1.6"}},
      "💡 ",
      el("strong",{style:{color:T.text}},"Jak działa nauka:"),
      " Zaczynasz od 5 słówek. Jak opanujesz (3x dobrze) — dodaję nowe. ",
      "Błędne słówka wracają po kilku turach, nie od razu. ",
      "Opanowane słówka wracają do sprawdzenia po ok. 8 turach."
    ),
  ));

  wrap.appendChild(el("button",{style:{width:"100%",padding:"16px",borderRadius:"16px",border:"none",background:`linear-gradient(135deg,${T.green},${T.greenDim})`,color:"#000",fontWeight:800,fontSize:"17px",cursor:"pointer",boxShadow:`0 4px 24px ${T.green}33`},onClick:startLearn},"Zaczynamy! 🚀"));

  app.appendChild(wrap);
}

function renderDone(app){
  const pct=S.totalAnswered>0?Math.round(S.totalCorrect/S.totalAnswered*100):0;
  app.appendChild(el("div",{style:{textAlign:"center",marginTop:"60px"},class:"fade-in"},
    el("div",{style:{fontSize:"72px",marginBottom:"12px"}},"🏆"),
    el("h2",{style:{fontSize:"28px",fontWeight:800,color:"#fff",marginBottom:"8px"}},"Wszystko opanowane!"),
    el("p",{style:{fontSize:"15px",color:T.dim,marginBottom:"24px"}},`${VOCAB.length} / ${VOCAB.length} słówek`),
    el("div",{style:{display:"flex",justifyContent:"center",gap:"32px",marginBottom:"32px"}},
      el("div",{},el("div",{style:{fontSize:"32px",fontWeight:800,color:T.green}},""+S.totalCorrect),el("div",{style:{fontSize:"13px",color:T.dim}},"dobrze")),
      el("div",{},el("div",{style:{fontSize:"32px",fontWeight:800,color:T.text}},pct+"%"),el("div",{style:{fontSize:"13px",color:T.dim}},"celność")),
    ),
    el("button",{style:{padding:"14px 36px",borderRadius:"14px",border:"none",background:T.green,color:"#000",fontWeight:700,fontSize:"15px",cursor:"pointer"},onClick:()=>{S.phase="settings";render();}},"Jeszcze raz"),
  ));
}

function renderLearn(app){
  const act=S.activity;
  if(!act){pickNext();return;}
  const mastered=getMastered();
  const reviewing=getReviewing();
  const inProgress=S.pool.filter(i=>{const ws=S.wordState[i];return ws&&!ws.mastered;}).length;
  const ws=S.wordState[act.wordIdx]||{streak:0};
  const card=VOCAB[act.wordIdx];

  // ---- Header ----
  const header=el("div",{style:{position:"sticky",top:0,zIndex:10,background:T.bg,padding:"14px 0 8px"}});

  const statsRow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
    el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
      el("span",{style:{fontSize:"22px",fontWeight:800,color:T.green}},""+mastered),
      el("span",{style:{fontSize:"12px",color:T.dim}},` / ${VOCAB.length}`),
    ),
    el("div",{style:{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}},
      S.combo>=3?el("span",{style:{fontSize:"12px",fontWeight:700,color:T.gold}},"🔥"+S.combo):null,
      reviewing>0?el("span",{style:{padding:"3px 8px",borderRadius:"6px",background:T.blueBg,border:`1px solid ${T.blue}33`,fontSize:"11px",color:T.blue,fontWeight:700}},"🔍 "+reviewing+" powt."):null,
      el("span",{style:{padding:"3px 8px",borderRadius:"6px",background:T.orangeBg,border:`1px solid ${T.orange}33`,fontSize:"11px",color:T.orange,fontWeight:700}},"📖 "+inProgress),
    ),
  );
  header.appendChild(statsRow);

  const bar=el("div",{style:{height:"8px",background:T.border,borderRadius:"4px",overflow:"hidden",marginBottom:"8px"}});
  bar.appendChild(el("div",{style:{height:"100%",borderRadius:"4px",background:`linear-gradient(90deg,${T.green},${T.greenDim})`,width:(mastered/VOCAB.length*100)+"%",transition:"width .6s cubic-bezier(.4,0,.2,1)"}}));
  header.appendChild(bar);

  // Pips
  const pips=el("div",{style:{display:"flex",gap:"3px",flexWrap:"wrap",maxHeight:"14px",overflow:"hidden"}});
  S.pool.slice(0,30).forEach(i=>{
    const s=S.wordState[i]||{streak:0};
    const done=s.mastered&&!s.reviewing;
    const rev=s.reviewing;
    const cur=act.wordIdx===i||(act.matchWords&&act.matchWords.includes(i));
    const cd=s.cooldown>0;
    let bg=T.border;
    if(done)bg=T.green;
    else if(rev)bg=T.blue;
    else if(cur)bg="#fff";
    else if(cd)bg=T.red+"88";
    else if(s.streak>0)bg=T.orange;
    pips.appendChild(el("div",{class:"word-pip",style:{background:bg,opacity:done?"0.5":"1"}}));
  });
  if(S.pool.length>30)pips.appendChild(el("span",{style:{fontSize:"10px",color:T.dim,alignSelf:"center",marginLeft:"4px"}},`+${S.pool.length-30}`));
  header.appendChild(pips);
  app.appendChild(header);

  // Badge
  const colors={flash:T.blue,quiz4:T.green,write:T.orange,match:T.gold};
  const labels={flash:"🔄 Fiszka",quiz4:"🎯 Quiz",write:"✍️ Napisz",match:"🧩 Dopasuj"};
  const bgs={flash:T.blueBg,quiz4:T.greenBg,write:T.orangeBg,match:T.goldBg};
  const dots=[];
  for(let i=0;i<MASTERY;i++)dots.push(el("span",{style:{color:i<ws.streak?T.green:T.border+"88",fontSize:"14px"}},"●"));

  const badgeRow=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",margin:"10px 0 14px",flexWrap:"wrap"},class:"fade-in"},
    el("span",{style:{padding:"4px 12px",borderRadius:"8px",fontSize:"12px",fontWeight:700,background:bgs[act.type],color:colors[act.type],border:`1px solid ${colors[act.type]}33`}},labels[act.type]),
    ws.reviewing?el("span",{style:{padding:"3px 8px",borderRadius:"6px",background:T.blueBg,border:`1px solid ${T.blue}33`,fontSize:"11px",color:T.blue,fontWeight:700}},"🔍 Powtórka"):null,
    el("span",{style:{fontSize:"12px",color:T.dim}},...dots),
  );
  app.appendChild(badgeRow);

  // Content
  const content=el("div",{class:"fade-in",style:{width:"100%"}});

  if(act.type==="flash") renderFlash(content,act,card);
  else if(act.type==="quiz4") renderQuiz(content,act,card);
  else if(act.type==="write") renderWrite(content,act,card);
  else if(act.type==="match") renderMatch(content,act);

  app.appendChild(content);

  // Mastered overlay
  if(S.justMastered!==null){
    const w=VOCAB[S.justMastered];
    const isReview=S.wordState[S.justMastered]?.reviewing===false&&S.justReview;
    app.appendChild(el("div",{style:{position:"fixed",top:0,left:0,right:0,bottom:0,background:`${T.bg}DD`,zIndex:100,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"},class:"fade-in"},
      el("div",{style:{fontSize:"56px",marginBottom:"12px"},class:"pop"},"⭐"),
      el("div",{style:{fontSize:"22px",fontWeight:800,color:T.green,marginBottom:"4px"}},isReview?"Wciąż pamiętasz!":"Słówko opanowane!"),
      el("div",{style:{fontSize:"18px",fontWeight:600,color:"#fff",marginBottom:"8px"}},w[0]+" = "+w[1]),
      S.justAdded?el("div",{style:{fontSize:"14px",color:T.orange,fontWeight:600}},"+"+S.justAdded+" nowe słówka w puli"):null,
    ));
  }
}

function renderFlash(wrap,act,card){
  wrap.appendChild(el("div",{style:{width:"100%",minHeight:"220px",background:S.flipped?`linear-gradient(145deg,${T.greenDim}18,${T.card})`:T.card,borderRadius:"20px",border:`1px solid ${S.flipped?T.green+"44":T.border}`,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"32px 24px",cursor:"pointer",transition:"all .3s",userSelect:"none",position:"relative"},onClick:()=>{S.flipped=!S.flipped;render();}},
    el("div",{style:{fontSize:"11px",color:T.dim,marginBottom:"14px",letterSpacing:"2px",textTransform:"uppercase"}},S.flipped?"PO POLSKU":"AUF DEUTSCH"),
    el("div",{style:{fontSize:S.flipped?"24px":"28px",fontWeight:700,textAlign:"center",color:S.flipped?T.green:"#fff",lineHeight:"1.3"}},S.flipped?card[1]:card[0]),
    el("div",{style:{position:"absolute",bottom:"14px",fontSize:"11px",color:T.dim}},S.flipped?"Kliknij żeby wrócić":"Kliknij żeby odkryć"),
  ));
  if(S.flipped){
    wrap.appendChild(el("div",{style:{display:"flex",gap:"12px",marginTop:"16px",width:"100%"}},
      el("button",{style:{flex:1,padding:"14px",borderRadius:"14px",border:`1px solid ${T.red}33`,background:T.redBg,color:T.red,fontWeight:700,fontSize:"15px",cursor:"pointer"},onClick:()=>handleAnswer(act.wordIdx,false)},"Nie wiem 😕"),
      el("button",{style:{flex:1,padding:"14px",borderRadius:"14px",border:`1px solid ${T.green}33`,background:T.greenBg,color:T.green,fontWeight:700,fontSize:"15px",cursor:"pointer"},onClick:()=>handleAnswer(act.wordIdx,true)},"Wiem! ✓"),
    ));
  }
}

function renderQuiz(wrap,act,card){
  wrap.appendChild(el("div",{style:{width:"100%",padding:"24px",background:T.card,borderRadius:"20px",border:`1px solid ${T.border}`,textAlign:"center",marginBottom:"14px"}},
    el("div",{style:{fontSize:"11px",color:T.dim,marginBottom:"10px",letterSpacing:"2px",textTransform:"uppercase"}},"Co znaczy:"),
    el("div",{style:{fontSize:"26px",fontWeight:700,color:"#fff"}},card[0]),
  ));
  const opts=el("div",{style:{display:"flex",flexDirection:"column",gap:"8px",width:"100%"}});
  act.options.forEach((optIdx,i)=>{
    const opt=VOCAB[optIdx];
    const isCorrect=optIdx===act.wordIdx;
    const isSel=S.quizAnswer===i;
    const show=S.quizAnswer!==null;
    let bg=T.card,bc=T.border,tc=T.text,op="1";
    if(show&&isCorrect){bg=T.greenBg;bc=T.green;tc=T.green;}
    if(show&&isSel&&!isCorrect){bg=T.redBg;bc=T.red;tc=T.red;}
    if(show&&!isCorrect&&!isSel)op="0.35";
    const btn=el("button",{style:{padding:"14px 18px",borderRadius:"14px",border:`1px solid ${bc}`,background:bg,color:tc,fontWeight:600,fontSize:"15px",cursor:show?"default":"pointer",textAlign:"left",transition:"all .2s",opacity:op}},opt[1]);
    if(!show)btn.addEventListener("click",()=>{S.quizAnswer=i;render();handleAnswer(act.wordIdx,isCorrect);});
    opts.appendChild(btn);
  });
  wrap.appendChild(opts);
}

function renderWrite(wrap,act,card){
  wrap.appendChild(el("div",{style:{width:"100%",padding:"24px",background:T.card,borderRadius:"20px",border:`1px solid ${T.border}`,textAlign:"center",marginBottom:"14px"}},
    el("div",{style:{fontSize:"11px",color:T.dim,marginBottom:"10px",letterSpacing:"2px",textTransform:"uppercase"}},"Przetłumacz:"),
    el("div",{style:{fontSize:"26px",fontWeight:700,color:"#fff"}},card[0]),
  ));
  const bc=S.writeResult==="correct"?T.green:S.writeResult==="wrong"?T.red:T.border;
  const input=el("input",{style:{width:"100%",padding:"14px 18px",borderRadius:"14px",border:`2px solid ${bc}`,background:T.surface,color:T.text,fontSize:"17px",outline:"none",boxSizing:"border-box"},placeholder:"Wpisz tłumaczenie...",value:S.writeInput,disabled:!!S.writeResult});
  input.addEventListener("input",e=>{S.writeInput=e.target.value;});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!S.writeResult)doCheck();});
  wrap.appendChild(input);
  setTimeout(()=>input.focus(),50);

  function doCheck(){
    const answers=card[1].split(",").map(s=>normalize(s));
    const inp=normalize(S.writeInput);
    const ok=answers.some(a=>{if(inp===a)return true;if(a.includes(inp)&&inp.length>3)return true;return false;});
    S.writeResult=ok?"correct":"wrong";
    render();
    setTimeout(()=>handleAnswer(act.wordIdx,ok),ok?800:2000);
  }

  if(!S.writeResult){
    wrap.appendChild(el("button",{style:{width:"100%",padding:"14px",borderRadius:"14px",border:"none",background:T.green,color:"#000",fontWeight:700,fontSize:"15px",cursor:"pointer",marginTop:"10px"},onClick:doCheck},"Sprawdź"));
  } else {
    wrap.appendChild(el("div",{style:{padding:"14px 18px",borderRadius:"14px",marginTop:"12px",background:S.writeResult==="correct"?T.greenBg:T.redBg,border:`1px solid ${S.writeResult==="correct"?T.green:T.red}33`}},
      el("div",{style:{fontSize:"14px",fontWeight:700,color:S.writeResult==="correct"?T.green:T.red,marginBottom:"4px"}},S.writeResult==="correct"?"Dobrze! ✓":"Poprawna odpowiedź:"),
      el("div",{style:{fontSize:"17px",color:T.text,fontWeight:600}},card[1]),
    ));
  }
}

function renderMatch(wrap,act){
  const pairs=act.matchPairs||[];
  const lefts=pairs.filter(p=>p.side==="left");
  const rights=pairs.filter(p=>p.side==="right");
  const grid=el("div",{style:{display:"flex",gap:"8px",width:"100%"}});
  [lefts,rights].forEach(side=>{
    const col=el("div",{style:{flex:1,display:"flex",flexDirection:"column",gap:"6px"}});
    side.forEach(item=>{
      const isM=S.matchMatched.has(item.pairId+item.side);
      const isSel=S.matchSelected?.id===item.id;
      const isW=S.matchWrong?.includes(item.id);
      let bg=T.card,bc=T.border,tc=T.text,op="1",td="none";
      if(isM){bg=T.greenBg;bc=T.green+"44";tc=T.green+"77";op="0.45";td="line-through";}
      if(isW){bg=T.redBg;bc=T.red;tc=T.red;}
      if(isSel){bg=T.greenBg;bc=T.green;}
      const btn=el("button",{style:{padding:"12px 10px",borderRadius:"12px",fontSize:"13px",fontWeight:600,border:`2px solid ${bc}`,background:bg,color:tc,cursor:isM?"default":"pointer",textDecoration:td,opacity:op,transition:"all .2s",textAlign:"center",minHeight:"48px",display:"flex",alignItems:"center",justifyContent:"center",width:"100%"}},item.text);
      if(!isM)btn.addEventListener("click",()=>{
        if(!S.matchSelected){S.matchSelected=item;S.matchWrong=null;render();return;}
        if(S.matchSelected.id===item.id){S.matchSelected=null;render();return;}
        if(S.matchSelected.side===item.side){S.matchSelected=item;render();return;}
        if(S.matchSelected.pairId===item.pairId){
          S.matchMatched.add(item.pairId+"left");
          S.matchMatched.add(item.pairId+"right");
          S.matchSelected=null;
          const total=(act.matchWords?.length||4)*2;
          if(S.matchMatched.size>=total){
            S.totalAnswered++;S.totalCorrect++;S.combo++;
            act.matchWords.forEach(wi=>{
              const prev=S.wordState[wi]||{streak:0,seen:0,lastWrong:false,cooldown:0};
              S.wordState[wi]={...prev,streak:prev.streak+1,seen:prev.seen+1,lastWrong:false};
            });
            render();
            setTimeout(()=>pickNext(),1000);
          } else render();
        } else {
          S.matchWrong=[S.matchSelected.id,item.id];
          S.combo=0;render();
          setTimeout(()=>{S.matchWrong=null;S.matchSelected=null;render();},500);
        }
      });
      col.appendChild(btn);
    });
    grid.appendChild(col);
  });
  wrap.appendChild(grid);
}

render();
</script>
</body>
</html>
